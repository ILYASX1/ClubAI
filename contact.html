
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club AI - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Club AI</h1>
        <p>Artificial Intelligence Club</p>
    </header>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="ateliers.html">Ateliers</a>
        <a href="programme.html">Programme</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>

        <section>
            <h2>Contactez-nous</h2>

            <p>
                Inscrivez-vous à un atelier ou posez-nous
                vos questions.
            </p>
        </section>

        <form>

            <fieldset>

                <legend>Vos informations</legend>

                <label for="nom">Nom complet :</label>
                <input type="text" id="nom" name="nom" required>

                <label for="email">E-mail :</label>
                <input type="email" id="email" name="email" required>

                <label for="telephone">Téléphone :</label>
                <input type="tel" id="telephone" name="telephone">

                <label for="date">Date souhaitée :</label>
                <input type="date" id="date" name="date">

            </fieldset>

            <fieldset>

                <legend>Votre participation</legend>

                <label for="filiere">Filière :</label>

                <select id="filiere" name="filiere">
                    <option value="IL">Ingénierie Logicielle (IL)</option>
                    <option value="ADIA">ADIA</option>
                    <option value="IISE">IISE</option>
                    <option value="autre">Autre</option>
                </select>

                <label for="atelier">Atelier préféré :</label>

                <select id="atelier" name="atelier">
                    <option value="assistant">Assistant pédagogique</option>
                    <option value="qualite">Qualité du code</option>
                    <option value="prototypage">Prototypage d'application</option>
                </select>

                <p>Niveau :</p>

                <input type="radio" id="debutant"
                       name="niveau" value="debutant">

                <label for="debutant">Débutant</label>

                <input type="radio" id="intermediaire"
                       name="niveau" value="intermediaire">

                <label for="intermediaire">Intermédiaire</label>

                <p>Centres d'intérêt :</p>

                <input type="checkbox" id="ia"
                       name="interets" value="IA">

                <label for="ia">IA</label>

                <input type="checkbox" id="web"
                       name="interets" value="Web">

                <label for="web">Web</label>

                <input type="checkbox" id="donnees"
                       name="interets" value="Donnees">

                <label for="donnees">Données</label>

            </fieldset>

            <fieldset>

                <legend>Votre message</legend>

                <label for="message">Message :</label>

                <textarea id="message" name="message"
                          rows="5"></textarea>

            </fieldset>

            <button type="submit">Envoyer</button>

            <button type="reset">Effacer</button>

        </form>

    </main>

    <footer>
        <p>Réalisé par ERRAMI Ilyass - Filière IL</p>
    </footer>

</body>
</html>
